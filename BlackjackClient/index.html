<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blackjack – Игра с дилером</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>♠️ BLACKJACK ♦️</h1>
            <div class="connection-status" id="connStatus">Соединение...</div>
        </header>

        <div class="main-game-area">

            <div class="game-column">
                <div class="dealer-area">
                    <h2>Дилер</h2>
                    <div class="cards" id="dealerCards"></div>
                    <div class="score" id="dealerScore">Очки: ?</div>
                </div>

                <div class="player-area">
                    <div class="player-info">
                        <span id="playerName">Игрок</span>
                        <span id="playerBalance">Баланс: 0</span>
                    </div>
                    <div class="hands-container" id="playerHands"></div>
                </div>

                <div class="other-players-area">
                    <h3>👥 Игроки за столом</h3>
                    <div id="otherPlayersList"></div>
                </div>

                <div class="controls">
                    <div class="bet-panel">
                        <label>Ставка:</label>
                        <input type="number" id="betAmount" value="50" min="10" step="10">
                        <button id="btnBet" disabled>Сделать ставку</button>
                        <button id="btnStart" disabled>Начать игру</button>
                        <button id="btnNewRound" style="display:none;">Новый раунд</button>
                    </div>
                    <div class="action-buttons">
                        <button id="btnHit" disabled>HIT</button>
                        <button id="btnStand" disabled>STAND</button>
                        <button id="btnDouble" disabled>DOUBLE</button>
                        <button id="btnSplit" disabled>SPLIT</button>
                    </div>
                    <div class="leave-button">
                        <button id="btnLeave">Покинуть стол</button>
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Введите сообщение...">
                    <button id="btnSendChat">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/websocket.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/statemachine.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
